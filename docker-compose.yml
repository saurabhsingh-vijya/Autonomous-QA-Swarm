services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qaswarm
      POSTGRES_PASSWORD: qaswarm-dev-only
      POSTGRES_DB: qaswarm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaswarm -d qaswarm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      AQS_DATABASE_URL: postgresql+psycopg://qaswarm:qaswarm-dev-only@postgres:5432/qaswarm
      AQS_DEV_AUTH: "true"
      AQS_CORS_ORIGINS: '["http://localhost:5173"]'
      AQS_LOG_LEVEL: INFO
      AQS_EXEC_TOKEN: ${AQS_EXEC_TOKEN:?set AQS_EXEC_TOKEN in .env (any long random string)}
      AQS_DEV_FIXTURE_REPOS: "true"
      AQS_FIXTURES_DIR: /fixtures
      AQS_EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence:/data/evidence
      - ./exec/fixtures:/fixtures:ro
    command: >
      sh -c "alembic upgrade head && python -m qaswarm.db.seed && python -m qaswarm.api.serve --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    environment:
      AQS_DATABASE_URL: postgresql+psycopg://qaswarm:qaswarm-dev-only@postgres:5432/qaswarm
      AQS_LOG_LEVEL: INFO
      AQS_DEV_FIXTURE_REPOS: "true"
      AQS_FIXTURES_DIR: /fixtures
    volumes:
      - ./exec/fixtures:/fixtures:ro
    command: python -m qaswarm.workflow.scheduler
    depends_on:
      api:
        condition: service_started

  # Execution Service host agent. No database access: it leases tasks from the control plane
  # over /internal/v1/exec/* with a shared token. In production this runs on separate,
  # disposable hosts; here it is one container for local development. SubprocessRuntime is
  # NOT a sandbox: repository code (pytest) stays refused unless the flag below is true.
  exec-host:
    build:
      context: ./exec
    environment:
      AQS_EXEC_CONTROL_PLANE_URL: http://api:8000
      AQS_EXEC_TOKEN: ${AQS_EXEC_TOKEN:?set AQS_EXEC_TOKEN in .env (any long random string)}
      AQS_EXEC_WORKER_ID: exec-host-1
      AQS_EXEC_ALLOW_UNSANDBOXED_CODE_EXECUTION: "false"
    depends_on:
      - api

  web:
    build:
      context: ./web
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  evidence:
