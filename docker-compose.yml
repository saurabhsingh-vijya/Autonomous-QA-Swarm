services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qaswarm
      POSTGRES_PASSWORD: qaswarm-dev-only
      POSTGRES_DB: qaswarm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaswarm -d qaswarm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AQS_DATABASE_URL: postgresql+psycopg://qaswarm:qaswarm-dev-only@postgres:5432/qaswarm
      AQS_DEV_AUTH: "true"
      AQS_CORS_ORIGINS: '["http://localhost:5173"]'
      AQS_LOG_LEVEL: INFO
      # Local demo: scheduler and one Execution Service worker run inside the API container.
      # The worker runs checks in a plain subprocess (NOT a sandbox); pytest stays refused
      # unless AQS_EXEC_ALLOW_UNSANDBOXED_CODE_EXECUTION=true is added here.
      AQS_EXEC_TOKEN: ${AQS_EXEC_TOKEN:?set AQS_EXEC_TOKEN in .env (any long random string)}
      AQS_EMBEDDED_SCHEDULER: "true"
      AQS_EMBEDDED_EXEC_WORKER: "true"
      AQS_DEV_FIXTURE_REPOS: "true"
      AQS_FIXTURES_DIR: /app/fixtures
      AQS_EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence:/data/evidence
      - ./exec/fixtures:/app/fixtures:ro
    command: >
      sh -c "alembic upgrade head && python -m qaswarm.db.seed && python -m qaswarm.api.serve --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  # A separate exec-host service (qaswarm_exec on its own host, no database route) is the
  # production shape; it is not defined here because this build has no sandbox runtime yet
  # (slice 1c). The embedded worker above is for the local demo only.

volumes:
  pgdata:
  evidence:
