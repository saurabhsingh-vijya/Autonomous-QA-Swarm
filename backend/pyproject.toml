[project]
name = "qaswarm"
version = "0.1.0"
description = "Autonomous QA Swarm control plane (slice 1a: boilerplate and foundations)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.128,<1",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-ulid>=3.0,<4",
  "sse-starlette>=2.1,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
# The embedded dev worker (AQS_EMBEDDED_EXEC_WORKER=true) imports qaswarm_exec; a production
# control plane does not need it (the Execution Service runs on its own hosts).
embedded = ["qaswarm-exec"]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.0,<8",
  "hypothesis>=6.115,<7",
  "httpx>=0.27,<0.29",
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2",
  "qaswarm-exec",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qaswarm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
pycodestyle = { max-line-length = 120 }
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
files = ["src/qaswarm"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qaswarm.api.*", "qaswarm.db.*", "qaswarm.telemetry.*"]
strict = false
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs PostgreSQL via AQS_TEST_DATABASE_URL",
]
filterwarnings = ["error::DeprecationWarning:qaswarm.*"]

[tool.uv.sources]
qaswarm-exec = { path = "../exec", editable = true }
