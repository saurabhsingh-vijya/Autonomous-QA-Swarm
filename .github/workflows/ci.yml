name: ci

on:
  push:
    branches: [main, "phase-*", "phase*", "feature/*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaswarm
          POSTGRES_PASSWORD: qaswarm-ci-only
          POSTGRES_DB: qaswarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qaswarm -d qaswarm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AQS_DATABASE_URL: postgresql+psycopg://qaswarm:qaswarm-ci-only@localhost:5432/qaswarm_test
      AQS_TEST_DATABASE_URL: postgresql+psycopg://qaswarm:qaswarm-ci-only@localhost:5432/qaswarm_test
      AQS_DEV_AUTH: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v4.2.0
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check . ../exec/src
      - run: uv run ruff format --check . ../exec/src
      - run: uv run mypy src ../exec/src
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
